<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Opening QR</title>
</head>
<body>
  <p>Opening QR...</p>
  <script>
    (function () {
      var base = 'https://script.google.com/macros/s/AKfycbwx8AAO5cUH9956fpPR9EuMI6dFwBOo9w33QgaSKjcxEqQrZvDLKIRXgvPgwN9Df8Ck/exec';
      var params = new URLSearchParams(location.search);
      params.set('page', 'go');
      location.replace(base + '?' + params.toString());
    })();
  </script>
</body>
</html>
