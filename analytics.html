<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Analytics — Ramani QR Studio</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/style.css"></head><body>
<header class="site-header"><a class="brand" href="index.html"><img src="assets/ramani-logo.png" alt="Ramani"><span>QR Studio</span></a><nav><a href="index.html">Generator</a><a class="active" href="analytics.html">Analytics</a></nav><span class="internal-pill">Internal use only</span></header>
<main class="page-shell"><section class="hero compact"><p class="eyebrow">TRACKING REPORT</p><h1>QR Analytics</h1><p>Search and review scans by unique QR Name.</p></section>
<section class="analytics-panel panel"><div class="analytics-toolbar"><input id="searchInput" type="search" placeholder="Search QR Name or type"><button id="refreshBtn" class="secondary-btn" type="button">Refresh</button></div><div id="analyticsError" class="inline-error" hidden></div>
<div class="stats"><div><span>Total QR codes</span><strong id="totalQr">—</strong></div><div><span>Total scans</span><strong id="totalScans">—</strong></div><div><span>Scans today</span><strong id="todayScans">—</strong></div></div>
<div class="table-wrap"><table><thead><tr><th>QR Name</th><th>Type</th><th>Total scans</th><th>Last scan</th><th>Created</th><th></th></tr></thead><tbody id="analyticsBody"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></section>
<section id="detailPanel" class="detail-panel panel" hidden><div class="section-head"><div><p class="eyebrow">QR DETAILS</p><h2 id="detailName">—</h2></div><button id="closeDetail" class="ghost-btn" type="button">Close</button></div><div id="detailMeta"></div><h3>Scan history</h3><div id="scanHistory" class="scan-history"></div></section></main><footer>Ramani Groups · Internal use only</footer>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/analytics.js"></script></body></html>
